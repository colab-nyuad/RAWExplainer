output_dir: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/EdgeRAWExplainer/

dataset:
  class: FB15k-237
  root:  /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/datasets/knowledge_graphs/

wandb:
  use: yes
  entity: "team_ryoji"
  project: SampleX-FB15k-237
  name: EdgeRAWExplainer-MST-Samyam

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: yes
  remove_one_hop: yes
  use_pyg_propagation: yes

explainer:
  class: RAWExplainer
  size_reg: 5
  ent_reg: 4
  temp_start: 3
  temp_end: 1
  sample_bias: 0.4
  rel_emb: yes
  num_mlp_layer: 2
  use_default_aggr: no
  topk_tails: 2
  ego_network: yes
  # Random Walks
  random_walk_loss: no
  random_walk_inf: no
  teleport_prob: 0.2
  rw_topk_edge: 1000
  reg_loss_inside: 3
  reg_loss_outside: 0.75
  use_teleport_adj: yes
  # Edge Random Walk
  edge_random_walk: yes
  convergence: edge
  # Spanning Tree
  spanning_tree: yes
  spanning_tree_node_ratio: 0.8
  # Optims
  factual: yes
  counter_factual: no
  expl_gnn_model: no

explainer_eval: # the evaluation of the explainers
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k_train: [25, 500] 
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500]
  eval_type: [factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 0.5
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 1.0e-5

train:
  gpus: {{ gpus }}
  batch_size: 8
  num_epoch: 5
  log_interval: 100
  num_workers: 4
  step: 1
  checkpoint_best: yes
  train_on_val: no
  train_samples_count: 18000

checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/checkpoint/explain/fb15k237_dist_eval.pth
eval_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/checkpoint/explain/fb15k237_dist_eval.pth

save_explanation: yes
valid_walltime: 20
