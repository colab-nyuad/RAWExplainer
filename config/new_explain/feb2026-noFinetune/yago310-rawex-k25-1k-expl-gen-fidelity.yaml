output_dir: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/RAWExplainer/

dataset:
  class: YAGO310
  root: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/datasets/knowledge_graphs/

wandb:
  use: {{ use_wandb }}
  entity: "team_ryoji"
  project: SampleX-YAGO310
  name: RAWExplainer-YAGO-Phi-Dist-4%-Finetune-4%-Resume-Re-K25-1k-Fidelity

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: no
  use_pyg_propagation: yes

explainer:
  class: RAWExplainer
  size_reg: 4
  ent_reg: 2
  temp_start: 2
  temp_end: 2
  sample_bias: 0.4
  rel_emb: yes
  num_mlp_layer: 2
  use_default_aggr: no
  topk_tails: 2
  ego_network: no
  joint_training: no
  # Random Walks
  random_walk_loss: yes
  adj_aggr: sum
  teleport_prob: 0.2
  rw_topk_node: 500
  reg_loss_inside: 1
  reg_loss_outside: 0.5
  use_teleport_adj: yes
  # Path Loss
  with_path_loss: no
  reg_path_loss: 3
  max_path_length: 3
  # Optims
  factual: yes
  counter_factual: no
  expl_gnn_model: no

explainer_eval: # the evaluation of the explainers
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval, counter_factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 0.00005

train:
  gpus: {{ gpus }}
  batch_size: 10
  num_epoch: 0
  log_interval: 100
  num_workers: 4
  step: 1
  checkpoint_best: yes
  train_on_val: yes

checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/YAGO310/2026-01-12-20-32-41-phi-dist-4perc/model_epoch_0.pth
eval_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/YAGO310/2026-01-12-20-32-41-phi-dist-4perc/model_epoch_0.pth
explainer_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/RAWExplainer/NBFNet/YAGO310/2026-01-15-11-49-41-4perc-4perc-failed-in-finetuning/model_epoch_1.pth

save_explanation: yes
valid_walltime: 20