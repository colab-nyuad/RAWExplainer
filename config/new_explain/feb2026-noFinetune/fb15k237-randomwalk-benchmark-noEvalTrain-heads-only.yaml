output_dir: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/RandomWalk-ModelAgnostic/

dataset:
  class: FB15k-237
  root:  /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/datasets/knowledge_graphs/

wandb:
  use: {{use_wandb}}
  entity: "team_ryoji"
  project: SampleX-FB15k-237
  name: RandomWalk-ModelAgnostic-HeadOnly

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: yes
  remove_one_hop: yes
  randomized_edge_drop: 0
  use_pyg_propagation: yes

explainer:
  class: RandomWalk
  topk_tails: 0                # Model agnostic => no topk_tails
  teleport_prob: 0.2
  adj_aggr: max
  ego_network: no
  factual: yes
  counter_factual: no
  use_head_only: yes           # ONLY head as central node - no GT bias!

explainer_eval: # the evaluation of the explainers
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 5.0e-4

train:
  gpus: {{gpus}}
  batch_size: 32
  num_epoch: 0
  log_interval: 100
  num_workers: 4
  step: 1

checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/checkpoint/explain/fb15k237_dist_eval.pth
eval_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/checkpoint/explain/fb15k237_dist_eval.pth

save_explanation: yes
evaluate_on_train: no