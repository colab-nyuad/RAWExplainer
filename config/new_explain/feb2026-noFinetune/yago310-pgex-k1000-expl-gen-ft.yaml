output_dir: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/PGExplainer/

dataset:
  class: YAGO310
  root: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/datasets/knowledge_graphs/

wandb:
  use: {{ use_wandb }}
  entity: "team_ryoji"
  project: SampleX-YAGO310
  name: PGExplainer-YAGO-Phi-Dist-Finetune-Only-Re-K25-1k

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: no
  use_pyg_propagation: yes

explainer:
  class: PGExplainer
  size_reg: 4
  ent_reg: 2
  temp_start: 2
  temp_end: 2
  sample_bias: 0.4
  num_mlp_layer: 2
  topk_tails: 1
  use_default_aggr: no
  mode: inductive
  factual: yes
  counter_factual: no

explainer_eval: # the evaluation of the explainers
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 0.00005

train:
  gpus: {{gpus}}
  batch_size: 6
  num_epoch: 0
  log_interval: 100
  num_workers: 4
  step: 1
  checkpoint_best: yes
  train_on_val: yes

checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/YAGO310/2025-09-19-11-27-23-phi-dist/model_epoch_0.pth
eval_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/YAGO310/2025-09-19-11-27-23-phi-dist/model_epoch_0.pth
explainer_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/PGExplainer/NBFNet/YAGO310/2026-01-06-14-05-11-pg-both-stages/model_epoch_5.pth

save_explanation: yes     # 'yes' requires 1 GPU so run it separately
valid_walltime: 20