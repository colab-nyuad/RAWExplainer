output_dir: /scratch/dd115/sam/RAWExplainer/NBFNet-PyG/explanation/CF/PGExplainer/

dataset:
  class: NELL995
  root: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/datasets/knowledge_graphs/

wandb:
  use: {{use_wandb}}
  entity: "team_ryoji"
  project: SampleX-NELL995
  name: PGExplainer-Eval-CF

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: no
  use_pyg_propagation: yes

explainer:
  class: PGExplainer
  size_reg: 2
  ent_reg: 4
  temp_start: 4
  temp_end: 3
  sample_bias: 0.5
  num_mlp_layer: 3
  topk_tails: 1
  ego_network: yes
  use_default_aggr: no
  mode: inductive
  factual: yes
  counter_factual: no

explainer_eval: # the evaluation of the explainers
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval, counter_factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 0.001

train:
  gpus: {{gpus}}
  batch_size: 24
  num_epoch: 0
  log_interval: 100
  num_workers: 4
  step: 1
  checkpoint_best: yes
  train_on_val: yes

checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/NELL995/2025-09-19-11-26-51-phi-eval-dist/model_epoch_15.pth
eval_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/NELL995/2025-09-19-11-26-51-phi-eval-dist/model_epoch_15.pth
explainer_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/PGExplainer/NBFNet/NELL995/2026-01-06-13-30-34-both-steps/model_epoch_15.pth

save_explanation: yes     # run a separate evaluation with single GPU with "yes" after training to save explanations
valid_walltime: 20