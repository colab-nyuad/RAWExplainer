output_dir: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/BFSDistance/

dataset:
  class: NELL995
  root:  /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/datasets/knowledge_graphs/

wandb:
  use: no
  entity: "team_ryoji"
  project: SampleX-NELL995
  name: BFSDistance-{{k_hops}}hops

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: no
  use_pyg_propagation: yes

explainer:
  class: BFSDistance
  topk_tails: 1                   # Ignored when use_ground_truth_only=yes
  hops: {{k_hops}}                # BFS hop limit from central nodes
  ego_network: yes                # Must be yes for BFSDistance
  use_ground_truth_only: yes      # MODEL-AGNOSTIC: uses only (h, gt_tail), no NBFNet predictions!
  factual: yes
  counter_factual: no

explainer_eval:
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 5.0e-4

train:
  gpus: {{gpus}}
  batch_size: 16
  num_epoch: 0
  log_interval: 100
  num_workers: 4
  step: 1

checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/NELL995/2025-09-19-11-26-51-phi-eval-dist/model_epoch_15.pth
eval_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/NELL995/2025-09-19-11-26-51-phi-eval-dist/model_epoch_15.pth

save_explanation: yes
evaluate_on_train: no
