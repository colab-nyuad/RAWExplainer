output_dir: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/explanation/RAWExplainer/

dataset:
  class: FB15k-237
  root: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/datasets/knowledge_graphs/

wandb:
  use: yes
  entity: "team_ryoji"
  project: SampleX-FB15k-237
  name: RAWExplainer-4Percent+4Percent-NetworkX-Var11

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: yes
  remove_one_hop: yes
  use_pyg_propagation: yes

explainer:
  class: RAWExplainer
  size_reg: 4
  ent_reg: 8
  temp_start: 1
  temp_end: 5
  sample_bias: 0.5
  rel_emb: yes
  num_mlp_layer: 2
  use_default_aggr: no
  topk_tails: 3
  ego_network: yes
  # Random Walks
  random_walk_loss: yes
  adj_aggr: sum
  teleport_prob: 0.4
  rw_topk_node: 1000
  reg_loss_inside: 0.5
  reg_loss_outside: 0
  use_teleport_adj: yes
  threshold: 0.5
  # Path Loss
  with_path_loss: no
  reg_path_loss: 3
  max_path_length: 3
  # Optims
  factual: yes
  counter_factual: no
  expl_gnn_model: no

explainer_eval: # the evaluation of the explainers
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500]
  eval_type: [factual_eval]

task:
  num_negative: 16
  strict_negative: yes
  adversarial_temperature: 0.5
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 5.0e-5

train:
  gpus: {{gpus}}
  batch_size: 18
  num_epoch: 3
  log_interval: 100
  num_workers: 4
  step: 1
  checkpoint_best: yes
  train_on_val: yes

checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/FB15k-237/2026-01-13-14-15-25-lambda-contined-done-4perc/model_epoch_13.pth
eval_checkpoint: /scratch/sl9030/gml/Graph-Transformer/NBFNet-PyG/experiments/NBFNet/FB15k-237/2026-01-13-14-15-25-lambda-contined-done-4perc/model_epoch_13.pth

save_explanation: yes
valid_walltime: 20