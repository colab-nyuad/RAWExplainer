output_dir: /scratch/id/RAWExplainer/explanation/RandomWalk/

dataset:
  class: WN18RR
  root: /scratch/id/RAWExplainer/datasets/knowledge_graphs/

wandb:
  use: {{ use_wandb }}
  entity: "team-name"
  project: project-name
  name: RandomWalk-WN18RR

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: no
  use_pyg_propagation: yes

explainer:
  class: RandomWalk
  topk_tails: 0
  teleport_prob: 0.2
  adj_aggr: max
  ego_network: no
  use_head_only: yes

explainer_eval:
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 5.0e-4

train:
  gpus: {{gpus}}
  batch_size: 8
  num_epoch: 0
  log_interval: 100
  num_workers: 4
  step: 1

checkpoint: checkpoint/explain/wn18rr_dist_eval.pth
eval_checkpoint: checkpoint/explain/wn18rr_dist_eval.pth

save_explanation: yes
valid_walltime: 20
