output_dir: /scratch/id/RAWExplainer/explanation/PaGELink/

dataset:
  class: NELL995
  root: /scratch/id/RAWExplainer/datasets/knowledge_graphs/

wandb:
  use: {{ use_wandb }}
  entity: "team-name"
  project: project-name
  name: PaGELink-NELL995

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: no
  use_pyg_propagation: yes

explainer:
  class: PaGELink
  prune_graph: yes
  with_path_loss: yes
  timeout_duration: 3
  topk_tails: 1
  prune_max_degree: 200
  k_core: 2
  num_paths: 4
  alpha: 1.0
  beta: 1.5
  ego_network: yes
  use_default_aggr: no

explainer_eval:
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 0.01

train:
  gpus: {{gpus}}
  batch_size: 16
  num_epoch: 20
  log_interval: 100
  num_workers: 4
  step: 1

checkpoint: checkpoint/explain/nell995_dist_eval_005b.pth
eval_checkpoint: checkpoint/explain/nell995_dist_eval_005b.pth

save_explanation: yes
valid_walltime: 20
