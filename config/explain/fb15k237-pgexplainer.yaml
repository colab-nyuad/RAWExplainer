output_dir: /scratch/id/RAWExplainer/explanation/PGExplainer/

dataset:
  class: FB15k-237
  root: /scratch/id/RAWExplainer/datasets/knowledge_graphs/

wandb:
  use: {{ use_wandb }}
  entity: "team-name"
  project: project-name
  name: PGExplainer-FB15k237

model:
  class: NBFNet
  input_dim: 32
  hidden_dims: [32, 32, 32, 32, 32, 32]
  message_func: distmult
  aggregate_func: pna
  short_cut: yes
  layer_norm: yes
  dependent: yes
  remove_one_hop: yes
  use_pyg_propagation: yes

explainer:
  class: PGExplainer
  size_reg: 5
  ent_reg: 2
  temp_start: 2
  temp_end: 2
  sample_bias: 0.5
  num_mlp_layer: 3
  topk_tails: 1
  ego_network: yes
  use_default_aggr: no
  mode: inductive

explainer_eval:
  eval_mask_type: hard_edge_mask_top_k
  hard_edge_mask_top_k: [25, 50, 75, 100, 300, 500, 1000]
  eval_type: [factual_eval]

task:
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 0.5
  metric: [mr, mrr, hits@1, hits@3, hits@10, inclusion, num_edges, num_nodes]

optimizer:
  class: Adam
  lr: 0.00005

train:
  gpus: {{gpus}}
  batch_size: 8
  num_epoch: 10
  log_interval: 100
  num_workers: 4
  step: 1
  checkpoint_best: yes
  train_on_val: yes

checkpoint: checkpoint/explain/fb15k237_dist_eval.pth
eval_checkpoint: checkpoint/explain/fb15k237_dist_eval.pth

save_explanation: yes
valid_walltime: 20
